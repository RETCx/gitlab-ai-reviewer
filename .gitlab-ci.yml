image: python:3.12-slim

stages:
  - test
  - build

unit-tests:
  stage: test
  script:
    - python -m pip install -r requirements.txt
    - python -m pytest -q

docker-build:
  stage: build
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker info
    - docker build -t gitlab-ai-reviewer:$CI_COMMIT_SHORT_SHA .